<!doctype html>
<html lang="nl-BE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Het dorp · Leerlichtjes</title>
  <meta name="description" content="Leerlichtjes voor de 2de graad: verken met je klas Het dorp en ontdek hoe een computer leert, wat een slimme speaker hoort, wat echt is en welk spoor je online achterlaat.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../../gedeeld/fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../lager.css">
  <script type="module" src="wereld.js"></script>
</head>
<body class="ll-wereld">
  <header class="ll-kop">
    <a class="ll-merk" href="../index.html"><span class="ll-lichtje" aria-hidden="true"></span>Leerlichtjes</a>
    <p class="ll-kop-titel"><span>2de graad</span> Het dorp</p>
    <div class="ll-kopknoppen">
      <a class="ll-kopknop" href="handleiding.html">Voor de leerkracht</a>
      <button type="button" class="ll-kopknop ll-avond" aria-pressed="false"><span class="ll-avond-icoon" aria-hidden="true"></span><span class="ll-avond-tekst">Avond</span></button>
      <button type="button" class="ll-kopknop ll-scherm">Volledig scherm</button>
    </div>
  </header>

  <main class="podium" id="inhoud">
    <div class="lucht ochtend" aria-hidden="true"></div>
    <div class="lucht dag" aria-hidden="true"></div>
    <!-- Zonder 3D: een vlakke schets van het dorp. De stations blijven bereikbaar via het dorpsplan. -->
    <svg class="schets" viewBox="0 0 640 400" role="img" aria-label="Een dorp met een bibliotheek, een huis, een fotowinkel, een park en een school">
      <rect x="20" y="300" width="600" height="60" rx="26" fill="#c2e3cc"/>
      <rect x="40" y="250" width="560" height="22" rx="8" fill="#c9c0b0"/>
      <g><rect x="60" y="160" width="110" height="90" rx="6" fill="#d98a6a"/><path d="M60 160h110l-14-14h-82z" fill="#d98a6a"/><path d="M80 146h70l-12-14h-46z" fill="#d98a6a"/></g>
      <g><rect x="250" y="180" width="130" height="70" rx="4" fill="#fffaf3"/><path d="M240 182l75-48 75 48z" fill="#b5523b"/></g>
      <g><rect x="450" y="160" width="100" height="90" rx="6" fill="#fbf3c4"/><rect x="480" y="128" width="44" height="30" rx="8" fill="#2b3038"/><circle cx="504" cy="143" r="9" fill="#5fa9c9"/></g>
      <g><ellipse cx="140" cy="300" rx="80" ry="20" fill="#9fd39b"/><ellipse cx="120" cy="300" rx="34" ry="10" fill="#7cc3dc"/></g>
      <g><rect x="440" y="270" width="140" height="34" rx="4" fill="#fcc89b"/><path d="M432 272l78-26 78 26z" fill="#b5523b"/></g>
      <circle cx="320" cy="292" r="24" fill="#e9e4da"/><path d="M300 292l20-26 20 26z" fill="#126425"/><circle cx="320" cy="252" r="9" fill="#ffcf3a"/>
    </svg>
    <canvas class="tafereel" aria-hidden="true"></canvas>
    <div class="labels"></div>
    <p class="laadtekst" aria-hidden="true">Het dorp wordt opgebouwd…</p>
  </main>

  <nav class="ll-dok" aria-label="Het dorpsplan: kies een station">
    <div class="ll-dok-stations"></div>
    <div class="ll-dok-eind">
      <p class="ll-teller" aria-live="polite"></p>
      <a class="ll-paspoort-link" href="paspoort.html">Ons paspoort</a>
      <button type="button" class="ll-wis">Nieuwe klas</button>
    </div>
  </nav>

  <section class="ll-venster" hidden aria-labelledby="ll-titel" role="dialog">
    <header class="ll-venster-kop">
      <span class="ll-nr" aria-hidden="true"></span>
      <div>
        <p class="ll-vraag"></p>
        <h2 id="ll-titel" tabindex="-1"></h2>
      </div>
      <button type="button" class="ll-sluit" aria-label="Sluit het station">×</button>
    </header>
    <nav class="ll-stappen" aria-label="De stappen van dit station">
      <button type="button" class="ll-stap"><span>1</span> Ontdek</button>
      <button type="button" class="ll-stap"><span>2</span> Doe</button>
      <button type="button" class="ll-stap"><span>3</span> Praat samen</button>
    </nav>
    <div class="ll-inhoud"></div>
    <footer class="ll-venster-voet">
      <button type="button" class="ll-knop zacht ll-terugknop">← Vorige</button>
      <button type="button" class="ll-knop ll-verder">Verder →</button>
    </footer>
  </section>
</body>
</html>
